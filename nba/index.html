<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#160d2b">
<link rel="icon" href="../favicon.png">
<title>NBA · doppie e triple doppie (prova)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Stessa ossatura dei cartellini (elenco partite + scheda, titoli in Big Shoulders, pillole), tema proprio: parquet di notte, arancione palla. */
:root {
  --bg1: #160d2b; --bg2: #0b1024; --surface: rgba(255,255,255,.055); --surface2: rgba(255,255,255,.085); --line: rgba(255,255,255,.13);
  --ink: #f3f1f8; --muted: #a9a6c2; --or: #ff8a1f; --or2: #ffc266; --cy: #37d6e6; --good: #4cc38a; --warn: #ffd166;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif; --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { min-height: 100vh; color: var(--ink); font: 16px/1.45 var(--body); background: linear-gradient(160deg, var(--bg1), var(--bg2) 70%) fixed; overflow-x: hidden; }
/* linee del campo: lunetta e cerchio di centrocampo, appena accennati */
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(circle at 100% 0, transparent 0 258px, rgba(255,138,31,.16) 259px 262px, transparent 263px),
    radial-gradient(circle at 100% 0, transparent 0 118px, rgba(255,138,31,.12) 119px 122px, transparent 123px),
    radial-gradient(circle at 0 78%, transparent 0 338px, rgba(55,214,230,.09) 339px 342px, transparent 343px),
    radial-gradient(circle at 0 78%, rgba(55,214,230,.05) 0 150px, transparent 151px); }
body::after { content: ""; position: fixed; inset: 0 0 auto 0; height: 5px; z-index: 50; background: linear-gradient(90deg, var(--or), var(--or2) 55%, var(--cy)); }
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 22px 16px 56px; display: grid; gap: 20px; }
.crumb { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); justify-self: start; }
.crumb span { font: 700 14px var(--body); padding: 7px 14px; border-radius: 999px; color: var(--muted); }
.crumb .on { background: linear-gradient(90deg, var(--or), #ff5e3a); color: #1a0d02; box-shadow: 0 0 14px rgba(255,138,31,.45); }
h1 { font: 900 clamp(34px, 6vw, 56px)/.9 var(--display); margin: 0; letter-spacing: .5px; text-transform: uppercase; text-wrap: balance;
     background: linear-gradient(90deg, #fff 0%, var(--or2) 55%, var(--or) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.meta { color: var(--muted); font-size: 14px; }
.meta b { color: var(--ink); font-weight: 600; }
#app { display: grid; gap: 14px; }
.sec { font: 800 20px/1.2 var(--display); text-transform: uppercase; letter-spacing: .6px; color: var(--or2); margin: 10px 0 -4px; }
.sec small { font: 500 13px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 8px; }

/* tre giocate */
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pick { border-radius: 14px; background: linear-gradient(180deg, var(--surface2), var(--surface)); border: 1px solid var(--line); padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; border-top: 4px solid var(--or); }
.pick.td { border-top-color: var(--cy); }
.pick .lab { grid-column: 1 / -1; font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 4px; }
.pick .nm { font: 900 28px/1 var(--display); text-transform: uppercase; letter-spacing: .3px; }
.pick .tm { font-size: 13px; color: var(--muted); }
.pick .pc { grid-row: 2 / span 2; grid-column: 2; font: 900 44px/.9 var(--display); color: var(--or2); font-variant-numeric: tabular-nums; text-align: right; }
.pick.td .pc { color: var(--cy); }
.pick .qt { grid-column: 1 / -1; margin-top: 8px; font-size: 14px; color: var(--muted); }
.pick .qt b { color: var(--warn); font-size: 17px; font-variant-numeric: tabular-nums; }
.dub { font: 800 10px var(--body); text-transform: uppercase; letter-spacing: .5px; padding: 2px 6px; border-radius: 4px; background: rgba(255,209,102,.18); color: var(--warn); white-space: nowrap; margin-left: 6px; vertical-align: 2px; }
.empty { color: var(--muted); font-size: 14px; grid-column: 1 / -1; }
/* righe: accoppiate e partite */
.rows { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .who { font-weight: 600; min-width: 0; }
.tier { display: block; font: 800 13px var(--display); text-transform: uppercase; letter-spacing: .9px; color: var(--or2); margin-bottom: 4px; }
.leg { padding: 2px 0; }
.leg small { display: inline; font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; white-space: nowrap; }
.leg .k { font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .4px; padding: 1px 6px; border-radius: 4px; background: rgba(255,138,31,.16); color: var(--or2); margin-left: 4px; white-space: nowrap; }
.leg .k.td { background: rgba(55,214,230,.16); color: var(--cy); }
.row .p small { display: block; font-size: 12px; color: var(--muted); }
.row .p { color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.row .q { font: 900 24px/1 var(--display); color: var(--warn); font-variant-numeric: tabular-nums; min-width: 62px; text-align: right; }
details { border-top: 1px solid var(--line); }
details:first-child { border-top: 0; }
summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 54px 1fr 1fr 18px; gap: 12px; align-items: center; padding: 12px 16px; }
summary::-webkit-details-marker { display: none; }
summary:hover { background: rgba(255,255,255,.04); }
summary:focus-visible { outline: 3px solid var(--or2); outline-offset: -3px; }
.time { font: 800 20px var(--display); font-variant-numeric: tabular-nums; }
.side { min-width: 0; }
.side .t { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .c { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .c em { font-style: normal; color: var(--or2); font-variant-numeric: tabular-nums; margin-left: 4px; }
.arrow { color: var(--muted); transition: transform .15s; text-align: center; }
details[open] .arrow { transform: rotate(90deg); }
details[open] summary { background: rgba(255,138,31,.07); }
.more { padding: 4px 16px 14px; }
.more .out { font-size: 13px; color: var(--muted); margin: 6px 0 8px; }
.pl { display: grid; grid-template-columns: 1fr 120px 52px 56px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
.pl .n { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .n small { color: var(--muted); margin-left: 4px; }
.pl .n .tr { color: var(--cy); font-size: 12px; margin-left: 6px; }
.bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--or), var(--or2)); }
.pl .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.pl .qq { text-align: right; font-variant-numeric: tabular-nums; color: var(--warn); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); }
@media (max-width: 720px) {
  .picks { grid-template-columns: 1fr; }
  summary { grid-template-columns: 46px 1fr 14px; }
  summary .side + .side { grid-column: 2; }
  summary .arrow { grid-row: 1 / span 2; grid-column: 3; }
  summary .time { grid-row: 1 / span 2; }
  .pl { grid-template-columns: 1fr 52px 52px; } .pl .bar { display: none; }
  .row { grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 14px; } .row .p { grid-column: 2; grid-row: 2; font-size: 13px; } .row .q { grid-column: 2; grid-row: 1; min-width: 54px; align-self: end; } .row .who { grid-row: 1 / span 2; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><span class="on">NBA</span><span>pagina di prova</span></div>
  <header>
    <h1 id="titolo">Doppie doppie</h1>
    <div class="meta" id="meta">Carico…</div>
  </header>
  <div id="app"></div>
  <div class="note">Percentuali del modello, quote dei bookmaker italiani quando ci sono. Pagina di prova: nelle verifiche il mercato è stato più preciso del modello, quindi nessun vantaggio dimostrato. Il gioco è vietato ai minori e può causare dipendenza.</div>
</div>
<script>
const pc = p => (p * 100).toFixed(p < 0.0995 ? 1 : 0).replace('.', ',') + '%';
const nq = q => q.toFixed(2).replace('.', ',');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const BOOK = { sisal: 'Sisal', bet365: 'bet365', eurobet: 'Eurobet', fanduel: 'FanDuel', draftkings: 'DraftKings' }, bk = b => BOOK[b] || b;
const cogn = n => { const p = String(n).split(' '); return p.length > 1 ? p.slice(1).join(' ') : n; };
const fmtG = new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }), fmtO = new Intl.DateTimeFormat('it-IT', { hour: '2-digit', minute: '2-digit' });
let D = null;
const dub = g => g.dubbio ? '<span class="dub">in dubbio</span>' : '';
function giocata(cls, etichetta, g, y, vuoto) {
  if (!g) return `<div class="pick ${cls}"><div class="lab">${etichetta}</div><div class="empty">${vuoto}</div></div>`;
  return `<div class="pick ${cls}"><div class="lab">${etichetta}</div><div class="nm">${esc(cogn(g.n))}</div><div class="pc">${pc(g['p_' + y])}</div><div class="tm">${esc(g.n)} · ${esc(g.sq)}${dub(g)}</div>`
    + `<div class="qt">${g['q_' + y] ? `quota <b>${nq(g['q_' + y])}</b> ${esc(bk(g['b_' + y]))}` : 'senza quota'}</div></div>`;
}
function disegna() {
  const C = D.consigli || {}, Ps = [...D.partite].sort((a, b) => a.ts - b.ts); let h = '';
  h += '<div class="sec">Le giocate della notte</div><div class="picks">'
    + giocata('', 'Doppia doppia · quota bassa', (C.bassa || [])[0], 'dd', 'Nessuna quota sotto 2,00.')
    + giocata('', 'Doppia doppia · quota alta', (C.alta || [])[0], 'dd', 'Nessuna quota alta adatta.')
    + giocata('td', 'Tripla doppia', (C.td || [])[0], 'td', 'Nessun candidato sopra il 3%.') + '</div>';
  if ((C.combinazioni || []).length) h += '<div class="sec">Combinazioni<small>giocatori di partite diverse · per ogni fascia di quota la più probabile</small></div><div class="rows">'
    + C.combinazioni.map(a => `<div class="row"><div class="who"><span class="tier">${esc(a.tipo)}</span>${a.gambe.map(g => `<div class="leg">${esc(g.n)} <span class="k ${g.cosa}">${g.cosa === 'td' ? 'tripla doppia' : 'doppia doppia'}</span><small>${pc(g.p)} · quota ${nq(g.q)}</small></div>`).join('')}</div><div class="p">esce ${pc(a.p)}<small>2 € → ${(2 * a.q).toFixed(0)} €</small></div><div class="q">${nq(a.q)}</div></div>`).join('') + '</div>';
  h += '<div class="sec">Partite<small>tocca una partita per vedere gli altri giocatori</small></div><div class="rows">';
  for (const P of Ps) {
    const c = k => P.giocatori.find(g => g.n === P.candidati[k]);
    const lato = k => { const g = c(k); return `<div class="side"><div class="t">${esc(P[k].nome)}</div><div class="c">${g ? `${esc(g.n)}<em>${pc(g.p_dd)}</em>` : '–'}</div></div>`; };
    const fuori = ['a', 'h'].flatMap(k => (P.fuori[k] || []).map(x => `${esc(x.n)} (${esc(P[k].sigla)})`));
    h += `<details><summary><span class="time">${fmtO.format(new Date(P.ts * 1000))}</span>${lato('a')}${lato('h')}<span class="arrow">›</span></summary><div class="more">`
      + `<div class="out">${fuori.length ? 'Assenti: ' + fuori.join(', ') : 'Nessun assente di peso'}</div>`
      + P.giocatori.filter(g => g.p_dd >= 0.04).slice(0, 7).map(g => `<div class="pl"><div class="n">${esc(g.n)}<small>${esc(g.sq)}</small>${dub(g)}${g.p_td >= 0.03 ? `<span class="tr">tripla ${pc(g.p_td)}${g.q_td ? ' · ' + nq(g.q_td) : ''}</span>` : ''}</div><div class="bar"><i style="width:${Math.max(3, Math.round(g.p_dd * 100))}%"></i></div><div class="v">${pc(g.p_dd)}</div><div class="qq">${g.q_dd ? nq(g.q_dd) : '–'}</div></div>`).join('')
      + '</div></details>';
  }
  document.getElementById('app').innerHTML = h + '</div>';
}
fetch('oggi.json?' + Date.now()).then(r => r.json()).then(j => { D = j;
  if (!D.partite.length) { document.getElementById('meta').textContent = 'Nessuna partita in programma.'; return; }
  const primo = new Date(Math.min(...D.partite.map(p => p.ts)) * 1000), agg = new Date(D.creato * 1000);
  document.getElementById('titolo').textContent = 'Doppie doppie';
  document.getElementById('meta').innerHTML = `Notte del <b>${fmtG.format(primo).replace(/^\S+\s/, '')}</b> · ${D.partite.length} partite · aggiornato alle ${fmtO.format(agg)}`;
  disegna();
}).catch(() => { document.getElementById('meta').textContent = 'Dati non ancora disponibili.'; });
</script>
</body>
</html>
