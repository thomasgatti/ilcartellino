name: Prova fonti dati
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/prova_fonti.yml']
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Prova FotMob, ESPN, Oddschecker
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in \
            "https://www.fotmob.com/api/data/matchDetails?matchId=6106291" \
            "https://www.fotmob.com/api/data/leagues?id=42" \
            "https://www.fotmob.com/api/data/matchOdds?matchId=6106330&ccode3=ESP" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/summary?event=401915311" \
            "https://www.oddschecker.com/it/calcio/coppe-e-amichevoli-per-club/champions-league/fenerbahce-v-liverpool" ; do
            code=$(curl -s -o /tmp/r -w "%{http_code}" -A "$UA" "$u"); echo "$code $(wc -c < /tmp/r) $u"; head -c 160 /tmp/r | tr '\n' ' '; echo; done
