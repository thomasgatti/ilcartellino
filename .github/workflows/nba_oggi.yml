name: NBA partite della notte (prova)
# Previsione di doppie e triple doppie per le partite NBA ancora da giocare oggi (giorno USA) e pagina di prova /nba/ (non collegata al sito).
# SOLO A MANO per ora: ogni giro pubblica nba/oggi.json su main e usa ~2 richieste OddsPapi per partita (chiave ODDSPAPI_KEY_NBA, 250 al mese).
on:
  workflow_dispatch:
    inputs:
      quote:
        description: Chiedere le quote a OddsPapi (si/no)
        default: 'si'
jobs:
  oggi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: dati
          path: dati
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas scikit-learn
      - name: Calendario, rose, infortuni, quote
        run: node cloud/nba/oggi.mjs /tmp/oggi_input.json
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY_NBA }}
          NBA_SENZA_QUOTE: ${{ inputs.quote == 'no' && '1' || '' }}
      - name: Controlli del modello
        run: python3 bot/nba/test_nba.py
      - name: Modello
        env:
          NBA_MODELLO: ${{ vars.NBA_MODELLO }}   # vuota o v1 = modello di sempre; v2 = bot/nba/modello2.py
        run: |
          python3 -c "import json,shutil;v=json.load(open('nba/oggi.json'));n=json.load(open('/tmp/oggi_input.json'));v.get('giorno')!=n['giorno'] and v.get('partite') and shutil.copy('nba/oggi.json','nba/ieri.json')" || true
          python3 bot/nba/oggi.py dati/nba /tmp/oggi_input.json nba/oggi.json
      - name: Pubblica
        run: |
          git config user.name "bot ammoniti" && git config user.email "bot@users.noreply.github.com"
          # 17/11: un errore di commit o push fa fallire il passo (prima finiva in "niente di nuovo" e il giro risultava riuscito)
          git add nba/oggi.json nba/ieri.json
          if git diff --cached --quiet; then
            echo "niente di nuovo"
          else
            git commit -qm "NBA: partite della notte $(date -u +%F)"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
      # Fotografia di ciò che il modello sapeva e ha detto, nel ramo dati (nba/registro/): serve alla prova «in avanti» (bot/nba/rapporto.py).
      # Non blocca la pubblicazione: se non riesce resta un avviso nel riepilogo del giro.
      - name: Registro delle previsioni (ramo dati)
        continue-on-error: true
        run: |
          if ! node -e "process.exit(require('/tmp/oggi_input.json').partite.length ? 0 : 1)"; then echo 'Nessuna partita: niente registro'; exit 0; fi
          cd dati
          for i in 1 2 3; do
            git fetch -q origin dati
            rm -rf /tmp/reg && git worktree prune && git worktree add -q --detach /tmp/reg FETCH_HEAD
            python3 ../bot/nba/registro.py /tmp/oggi_input.json ../nba/oggi.json /tmp/reg/nba
            git -C /tmp/reg add nba/registro
            git -C /tmp/reg -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "registro nba $(date -u +%FT%H:%MZ)"
            if git -C /tmp/reg push -q origin HEAD:dati; then echo 'Registro salvato'; exit 0; fi
            sleep 5
          done
          echo '::warning::Registro NBA non salvato nel ramo dati'
          exit 1
