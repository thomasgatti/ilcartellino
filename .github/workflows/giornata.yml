name: Giornata automatica
# Avvio programmato da cron-job.org (job "Giornata ilcartellino": POST all'API workflow_dispatch con prova=false,
# ogni 20 minuti dalle 11 alle 23:40 ora italiana, tranne il giovedì; token fine-grained "cron-job ilcartellino",
# solo Actions in scrittura su questo repository, scade l'8/11/2027). Il cron di GitHub partiva ogni qualche ora.
# Ripiego: parte comunque dopo ogni "Aggiorna dati FotMob" (ogni mattina).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/giornata.yml'
      - 'cloud/giornata.mjs'
      - 'cloud/angoli.mjs'
      - 'cloud/attesa.mjs'
  workflow_run:
    workflows: ['Aggiorna dati FotMob']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      prova:
        description: Solo prova, senza pubblicare
        type: boolean
        default: true
      extra:
        description: Ricalcola subito la sezione EXTRA
        type: boolean
        default: false

concurrency:
  group: pubblicazione-cartellino
  cancel-in-progress: false

jobs:
  giornata:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.CARTELLINO_AUTO == 'true') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          ref: dati
          path: dati
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attesa delle formazioni ufficiali (solo nell'ora prima del via)
        run: node cloud/attesa.mjs
        continue-on-error: true
        timeout-minutes: 20
        env:
          ATTESA_NO: ${{ github.event_name == 'workflow_dispatch' && inputs.prova && '1' || '' }}
      - name: Controlla formazioni ed esiti
        id: partite
        run: node cloud/giornata.mjs
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      - name: Sezione EXTRA (big match esteri e coppe nazionali)
        run: node cloud/extra.mjs
        continue-on-error: true
        env:
          EXTRA_FORZA: ${{ github.event_name == 'workflow_dispatch' && (inputs.prova || inputs.extra) && '1' || '' }}
      - name: Sezione ANGOLI (almeno 14 angoli nella partita)
        run: node cloud/angoli.mjs
        continue-on-error: true
        env:
          ANGOLI_FORZA: ${{ github.event_name == 'workflow_dispatch' && inputs.prova && '1' || '' }}
      - name: Rigenera l'interfaccia
        run: |
          if git diff --quiet -- bot/webapp/data.json bot/webapp/lineups.txt bot/webapp/vercel/risultati.json; then exit 0; fi
          cd bot/webapp
          python3 build.py
      - name: Registra i tris aggiornati
        if: steps.partite.outputs.previsioni != '' || steps.partite.outputs.revisioni != ''
        env:
          PARTITE: ${{ steps.partite.outputs.previsioni }}
          REVISIONI: ${{ steps.partite.outputs.revisioni }}
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node bot/webapp/tris_app.js "$PARTITE" "$REVISIONI"
      - name: Rigenera il sito Vercel
        run: |
          if git diff --quiet -- bot/webapp/index.html bot/webapp/tris_app.json bot/webapp/vercel/risultati.json; then exit 0; fi
          cd bot/webapp
          python3 build_vercel.py
          cp vercel/sito/index.html ../../index.html
      - name: Salva la prova
        if: github.event_name == 'workflow_dispatch' && inputs.prova
        uses: actions/upload-artifact@v4
        with:
          name: giornata-prova
          path: |
            index.html
            bot/webapp/data.json
            bot/webapp/lineups.txt
            bot/webapp/tris_app.json
            bot/webapp/vercel/risultati.json
      - name: Pubblica gli aggiornamenti
        if: github.ref == 'refs/heads/main' && vars.CARTELLINO_AUTO == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.prova)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          git add -- index.html bot/webapp/index.html bot/webapp/data.json bot/webapp/lineups.txt bot/webapp/tris_app.json bot/webapp/vercel/risultati.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Aggiorna formazioni ed esiti'
            git push origin HEAD:main
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            stamp=$(sed -n 's/^<meta name="build" content="\([^"]*\)">$/\1/p' index.html)
            site=$(curl -fsS --max-time 15 https://ilcartellino.vercel.app/ || true)
            if [ -n "$stamp" ] && ! printf '%s' "$site" | grep -Fq "<meta name=\"build\" content=\"$stamp\">"; then
              curl -fsS --max-time 20 --retry 2 -o /dev/null -X POST "$VERCEL_DEPLOY_HOOK"
            fi
          fi
