name: NBA - aggiornamento automatico quotidiano
# Avvio giornaliero nel primo pomeriggio americano, prima delle eventuali partite domenicali.
# Quote (dal 18/11/2026): /odds-by-tournaments, 1 richiesta per bookmaker (Sisal, bet365) dà tutte le partite della notte.
# Pomeriggio: 1 fixtures + 2 = 3 richieste; sera (rifai): 2 (gli id delle partite sono nella pagina) → ~5 al giorno, ~155 in 31 giorni su 250.
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      rifai:
        description: Rifare la pagina anche se la notte è già pubblicata, con quote rilette (2 richieste OddsPapi; se non arrivano valgono quelle salvate) — si/no
        default: 'no'

concurrency:
  group: nba-aggiornamento-quotidiano
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nba:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: dati
          path: dati
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla se la data NBA è già stata pubblicata
        id: giorno
        run: |
          GIORNO=$(TZ=America/New_York date +%Y%m%d)
          echo "giorno=$GIORNO" >> "$GITHUB_OUTPUT"
          if python3 - "$GIORNO" <<'PY'
          import json, sys
          try:
              d = json.load(open('nba/oggi.json'))
              assert d.get('giorno') == sys.argv[1]
          except (OSError, ValueError, AssertionError):
              sys.exit(1)
          PY
          then
            # si rifà solo se nessuna partita della notte è già cominciata: il calendario contiene solo quelle da giocare, le altre sparirebbero dalla pagina
            if [ "${{ inputs.rifai }}" = "si" ] && python3 -c "import json,time,sys; sys.exit(0 if min(p['ts'] for p in json.load(open('nba/oggi.json'))['partite']) > time.time() + 600 else 1)"; then
              echo "genera=si" >> "$GITHUB_OUTPUT"; echo "riusa=1" >> "$GITHUB_OUTPUT"; cp nba/oggi.json /tmp/nba_quote_salvate.json
              echo "Rifaccio la pagina di $GIORNO rileggendo le quote (se non arrivano valgono quelle salvate)"
            else
              echo "genera=no" >> "$GITHUB_OUTPUT"
              echo "La pagina NBA è già aggiornata per $GIORNO"
            fi
          else
            echo "genera=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Dipendenze del modello
        if: steps.giorno.outputs.genera == 'si'
        run: pip install -q pandas scikit-learn
      # Il giro programmato di «Dati NBA (ESPN)» arriva spesso con ore di ritardo: qui l'archivio viene portato alla notte scorsa
      # (solo nella copia di lavoro, senza salvarlo nel ramo dati), così riposi, back-to-back e «ultima notte» sono giusti.
      - name: Archivio aggiornato alla notte scorsa
        if: steps.giorno.outputs.genera == 'si'
        env:
          NBA_SENZA_INFORTUNI: '1'
        run: node cloud/nba/scrape.mjs dati/nba 5
      - name: Calendario, rose, infortuni e quote (limite mensile)
        if: steps.giorno.outputs.genera == 'si'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY_NBA }}
          NBA_QUOTE_SOLO_ITALIA: '1'
          NBA_QUOTE_MAX_PARTITE: '5'
          NBA_QUOTE_TORNEO: '1'
          NBA_FX_DA: /tmp/nba_quote_salvate.json
        run: node cloud/nba/oggi.mjs /tmp/nba_auto_input.json "${{ steps.giorno.outputs.giorno }}"
      # Controlli automatici del modello (archivio finto, pochi secondi): se falliscono non si pubblica nulla.
      - name: Controlli del modello
        if: steps.giorno.outputs.genera == 'si'
        run: python3 bot/nba/test_nba.py
      - name: Probabilità DD/TD e combinazioni
        if: steps.giorno.outputs.genera == 'si'
        env:
          NBA_MODELLO: ${{ vars.NBA_MODELLO }}   # vuota = v2 (predefinito dal 17/11), v1 = modello di prima: per tornare indietro creare la variabile NBA_MODELLO=v1 (si torna indietro togliendo la variabile)
        run: |
          # la pagina della notte prima resta visibile come «Notte scorsa» (nba/ieri.json)
          python3 - "${{ steps.giorno.outputs.giorno }}" <<'PY'
          import json, shutil, sys
          try:
              v = json.load(open('nba/oggi.json'))
              if v.get('giorno') != sys.argv[1] and v.get('partite'): shutil.copy('nba/oggi.json', 'nba/ieri.json')
          except (OSError, ValueError): pass
          PY
          if node -e "process.exit(require('/tmp/nba_auto_input.json').partite.length ? 0 : 1)"; then
            python3 bot/nba/oggi.py dati/nba /tmp/nba_auto_input.json nba/oggi.json ${{ steps.giorno.outputs.riusa == '1' && '/tmp/nba_quote_salvate.json' || '' }}
          else
            python3 - <<'PY'
          import json, time
          with open('/tmp/nba_auto_input.json') as f:
              d = json.load(f)
          with open('nba/oggi.json', 'w') as f:
              json.dump({'giorno': d['giorno'], 'creato': int(time.time()), 'partite': [],
                         'consigli': {'bassa': [], 'alta': [], 'td': [], 'combinazioni': []}}, f)
          PY
          fi
          python3 - "${{ steps.giorno.outputs.giorno }}" <<'PY'
          import json, sys
          d = json.load(open('nba/oggi.json'))
          assert d.get('giorno') == sys.argv[1], 'Data NBA errata'
          assert 'partite' in d and 'consigli' in d, 'Dati incompleti'
          assert all(p.get('giocatori') for p in d['partite']), 'Candidati mancanti'
          print('NBA:',len(d['partite']),'partite,',
                len(d['consigli'].get('combinazioni', [])),'combinazioni')
          PY
      - name: Come stanno andando le proposte (nba/storico.json)
        if: steps.giorno.outputs.genera == 'si'
        continue-on-error: true
        run: python3 bot/nba/storico.py dati/nba nba/storico.json --pagina nba/ieri.json
      - name: Pubblica soltanto i dati NBA
        if: steps.giorno.outputs.genera == 'si'
        run: |
          git add -- nba/oggi.json nba/ieri.json nba/storico.json
          if git diff --cached --quiet; then
            echo 'Nessun cambiamento NBA'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "NBA: aggiornamento automatico ${{ steps.giorno.outputs.giorno }}"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Pagina NBA pubblicata'
              exit 0
            fi
            sleep 3
          done
          echo 'Errore nella pubblicazione' >&2
          exit 1
      # Fotografia di ciò che il modello sapeva e ha detto, nel ramo dati (nba/registro/): serve alla prova «in avanti» (bot/nba/rapporto.py).
      # Non blocca la pubblicazione: se non riesce resta un avviso nel riepilogo del giro.
      - name: Registro delle previsioni (ramo dati)
        if: steps.giorno.outputs.genera == 'si'
        continue-on-error: true
        run: |
          if [ ! -s /tmp/nba_auto_input.json ]; then echo '::warning::Ingresso del modello mancante: niente registro'; exit 1; fi
          if ! node -e "process.exit(require('/tmp/nba_auto_input.json').partite.length ? 0 : 1)"; then echo 'Nessuna partita: niente registro'; exit 0; fi
          cd dati
          for i in 1 2 3; do
            git fetch -q origin dati
            rm -rf /tmp/reg && git worktree prune && git worktree add -q --detach /tmp/reg FETCH_HEAD
            python3 ../bot/nba/registro.py /tmp/nba_auto_input.json ../nba/oggi.json /tmp/reg/nba
            git -C /tmp/reg add nba/registro
            git -C /tmp/reg -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "registro nba $(date -u +%FT%H:%MZ)"
            if git -C /tmp/reg push -q origin HEAD:dati; then echo 'Registro salvato'; exit 0; fi
            sleep 5
          done
          echo '::warning::Registro NBA non salvato nel ramo dati'
          exit 1
