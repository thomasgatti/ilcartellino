name: Sonda NBA
# Prove sulle fonti NBA e su OddsPapi basket: stampa solo estratti nel log.
on:
  workflow_dispatch:
    inputs:
      script:
        description: Script in cloud/nba/ da lanciare
        default: sonda_fonti.mjs
      arg:
        description: Argomenti
        default: ''
jobs:
  sonda:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cloud/nba/${{ inputs.script || 'sonda_fonti.mjs' }} ${{ inputs.arg }}
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY_NBA }}   # chiave separata: la quota mensile dei cartellini resta intatta
          GH_TOKEN: ${{ github.token }}
          SALTA_ELENCO: '1'
