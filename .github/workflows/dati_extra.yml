name: Dati EXTRA FotMob
# Statistiche di squadra (angoli, tiri, xG…) e per giocatore (gol, xG, tiri…) per le partite dell'archivio, nel ramo dati (cartella extra/).
# Manuale per recuperare lo storico; ogni giorno lo stesso passo gira dentro "Aggiorna dati FotMob" per le partite nuove.
on:
  workflow_dispatch:
    inputs:
      minuti:
        description: Minuti massimi di scaricamento
        default: '100'
      archivio:
        description: Quale archivio (club = dati/fotmob → dati/extra, nazionali = dati/nazionali → dati/extra_naz)
        type: choice
        options: [club, nazionali]
        default: club
concurrency: dati
jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: dati
          path: dati
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scarica
        run: |
          if [ "${{ inputs.archivio }}" = "nazionali" ]; then node cloud/scrape_extra.mjs dati/nazionali dati/extra_naz "${{ inputs.minuti }}"
          else node cloud/scrape_extra.mjs dati/fotmob dati/extra "${{ inputs.minuti }}"; fi
      - name: Salva
        if: always()
        run: |
          cd dati && git config user.name "bot ammoniti" && git config user.email "bot@users.noreply.github.com"
          # 17/11: un errore di commit o push fa fallire il passo (prima finiva in "niente di nuovo" e il giro risultava riuscito)
          mkdir -p extra_naz
          git add -A extra extra_naz
          if git diff --cached --quiet; then
            echo "niente di nuovo"
          else
            git commit -qm "extra $(date -u +%F)"
            git push -q origin HEAD:dati
          fi
