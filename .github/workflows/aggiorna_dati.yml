name: Aggiorna dati FotMob
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'   # ogni giorno 05:17 UTC
concurrency: dati
jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: dati
          path: dati
        continue-on-error: true
      - name: Ramo dati (se non esiste)
        run: |
          if [ ! -d dati/.git ]; then mkdir -p dati && cd dati && git init -q -b dati && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scarica
        run: node cloud/scrape.mjs dati/fotmob 320
      - name: Partite nuove delle nazionali
        run: SCRAPE_SET=naz node cloud/scrape.mjs dati/nazionali 10
        continue-on-error: true
      - name: Dati EXTRA delle partite nuove
        run: node cloud/scrape_extra.mjs dati/fotmob dati/extra 20
        continue-on-error: true
      - name: Dati EXTRA delle nazionali (angoli, tiri…) per la sezione Angoli
        run: node cloud/scrape_extra.mjs dati/nazionali dati/extra_naz 10
        continue-on-error: true
      - name: Quote della stagione in corso (football-data.co.uk, per il contesto del modello)
        run: |
          mkdir -p dati/quote && cd dati/quote
          y=$(date -u +%y); m=$(date -u +%-m); if [ "$m" -ge 7 ]; then s="${y}$((10#$y+1))"; else s="$(printf %02d $((10#$y-1)))${y}"; fi
          for c in I1 E0 E1 SC0 D1 SP1 F1 N1 B1 P1 T1 G1; do
            curl -sSfL -A "Mozilla/5.0" -o "fd_${c}_${s}.tmp" "https://www.football-data.co.uk/mmz4281/${s}/${c}.csv" && mv "fd_${c}_${s}.tmp" "fd_${c}_${s}.csv"; rm -f "fd_${c}_${s}.tmp"; sleep 1
          done
        continue-on-error: true
      - name: Salva
        run: |
          cd dati && git config user.name "bot ammoniti" && git config user.email "bot@users.noreply.github.com"
          # 17/11: un errore di commit o push fa fallire il passo (prima finiva in "niente di nuovo" e il giro risultava riuscito)
          git add -A
          if git diff --cached --quiet; then
            echo "niente di nuovo"
          else
            git commit -qm "dati $(date -u +%F)"
            git push -q origin HEAD:dati
          fi
